daemon {
  executors {
    default-executor {
      thread-count = 2
      thread-count = ${?DAEMON_DEFAULT_EXECUTOR_THREAD_COUNT}
      shutdown-grace-period = 1s
      shutdown-grace-period = ${?DAEMON_DEFAULT_EXECUTOR_SHUTDOWN_GRACE_PERIOD}
    }
    database-executor {
      thread-count = 16
      thread-count = ${?DAEMON_DATABASE_EXECUTOR_THREAD_COUNT}
      shutdown-grace-period = 1s
      shutdown-grace-period = ${?DAEMON_DATABASE_EXECUTOR_SHUTDOWN_GRACE_PERIOD}
    }
    io-dispatcher {
      thread-count = 16
      thread-count = ${?DAEMON_IO_DISPATCHER_THREAD_COUNT}
      shutdown-grace-period = 1s
      shutdown-grace-period = ${?DAEMON_IO_DISPATCHER_SHUTDOWN_GRACE_PERIOD}
    }
  }

  jobs {
    spotify-access-token-refresh {
      enabled = true
      enabled = ${?DAEMON_JOB_SPOTIFY_ACCESS_TOKEN_REFRESH_ENABLED}
      interval = 30m
      timeout = 5m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
      batch-size = 50
    }

    followed-artists-sync-queue {
      enabled = true
      enabled = ${?DAEMON_JOB_FOLLOWED_ARTISTS_SYNC_QUEUE_ENABLED}
      interval = 1m
      timeout = 5m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
    }

    followed-artists-sync {
      enabled = true
      enabled = ${?DAEMON_JOB_FOLLOWED_ARTISTS_SYNC_ENABLED}
      interval = 1h
      timeout = 10m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
      batch-size = 25
      processing-lease = 1h
    }

    artist-release-sync-queue {
      enabled = true
      enabled = ${?DAEMON_JOB_ARTIST_RELEASE_SYNC_QUEUE_ENABLED}
      interval = 1m
      timeout = 5m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
    }

    artist-releases-sync {
      enabled = true
      enabled = ${?DAEMON_JOB_ARTIST_RELEASES_SYNC_ENABLED}
      interval = 1m
      timeout = 10m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
      batch-size = 50
      processing-lease = 1h
    }

    user-new-release-events-sync {
      enabled = true
      enabled = ${?DAEMON_JOB_USER_NEW_RELEASE_EVENTS_SYNC_ENABLED}
      interval = 1m
      timeout = 5m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
      batch-size = 500
    }

    user-new-release-notification-delivery-queue {
      enabled = true
      enabled = ${?DAEMON_JOB_USER_NEW_RELEASE_NOTIFICATION_DELIVERY_QUEUE_ENABLED}
      interval = 1m
      timeout = 10m
      retry {
        max-attempts = 3
        base-delay = 1s
        max-delay = 30s
        jitter-ratio = 0.2
      }
      batch-size = 25
      processing-lease = 1h
    }
  }
}

spotify.client.request-policy.pacing-interval = 500ms
