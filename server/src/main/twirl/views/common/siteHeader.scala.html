@(displayName: Option[String], currentPath: String)

<header class="site-header">
    <a class="site-brand" href="/">DACHSHUND</a>
    @for(name <- displayName) {
        <nav class="site-nav" aria-label="User navigation">
            <a class="site-nav-link @if(currentPath == "/") {is-active}" href="/">New releases</a>
            <a class="site-nav-link @if(currentPath == "/user-settings") {is-active}" href="/user-settings">Settings</a>
            <span class="site-user">@name</span>
        </nav>
    }
</header>
