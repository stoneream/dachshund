rules = [
  DisableSyntax,
  RemoveUnused,
  ExplicitResultTypes,
  JakartaInjectGuice
]

# Load the project compiler when Scalafix targets a different Scala 3 minor.
ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true

ExplicitResultTypes.memberKind = [
  Def
]
ExplicitResultTypes.memberVisibility = [
  Public,
  Protected
]

lint.error = {
  includes = ".*"
  excludes = "UnusedScalafixSuppression"
}
