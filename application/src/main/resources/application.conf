db {
  master {
    name = "default"
    driver = "com.mysql.cj.jdbc.Driver"
    driver = ${?DACHSHUND_DB_DRIVER}
    url = ${?DACHSHUND_DB_URL}
    user = ${?DACHSHUND_DB_USER}
    password = ${?DACHSHUND_DB_PASSWORD}
    hikari {
      pool-name = "master-hikari-pool"
      maximum-pool-size = 16
      minimum-idle = 16
      connection-timeout = 30000
      idle-timeout = 600000
      max-lifetime = 1800000
      validation-timeout = 5000
    }
  }
  slave = null
}

auth {
  session {
    signing {
      current-kid = "v1"
      current-kid = ${?DACHSHUND_SESSION_SIGNING_CURRENT_KID}
      keys {
        v1 = ${?DACHSHUND_SESSION_SIGNING_KEY_V1}
      }
    }
  }
}

cookie {
  session {
    name = "dachshund-session"
    name = ${?DACHSHUND_COOKIE_SESSION_NAME}
    secure = false
    secure = ${?DACHSHUND_COOKIE_SESSION_SECURE}
    same-site = "lax"
    same-site = ${?DACHSHUND_COOKIE_SESSION_SAME_SITE}
    domain = null
    domain = ${?DACHSHUND_COOKIE_SESSION_DOMAIN}
    max-age-seconds = 2592000
    max-age-seconds = ${?DACHSHUND_COOKIE_SESSION_MAX_AGE_SECONDS}
  }

  external-auth-state {
    name = "spotify-auth-state"
    name = ${?COOKIE_EXTERNAL_AUTH_STATE_NAME}
    name = ${?DACHSHUND_COOKIE_EXTERNAL_AUTH_STATE_NAME}
    secure = false
    secure = ${?DACHSHUND_COOKIE_EXTERNAL_AUTH_STATE_SECURE}
    same-site = "lax"
    same-site = ${?DACHSHUND_COOKIE_EXTERNAL_AUTH_STATE_SAME_SITE}
    domain = null
    domain = ${?DACHSHUND_COOKIE_EXTERNAL_AUTH_STATE_DOMAIN}
    max-age-seconds = 1800
    max-age-seconds = ${?DACHSHUND_COOKIE_EXTERNAL_AUTH_STATE_MAX_AGE_SECONDS}
  }
}

spotify {
  client {
    api-base-url = "https://api.spotify.com/v1"
    accounts-base-url = "https://accounts.spotify.com"
    client-id = ${?DACHSHUND_SPOTIFY_CLIENT_ID}
    client-secret = ${?DACHSHUND_SPOTIFY_CLIENT_SECRET}
    redirect-uri = ${?DACHSHUND_SPOTIFY_REDIRECT_URI}
    connect-timeout = 10s
    request-timeout = 30s
    retry {
      max-attempts = 3
      base-delay = 1s
      max-delay = 30s
      jitter-ratio = null
      rate-limit-max-delay = 120s
    }
  }

  token {
    refresh-margin = 300s
    encryption-key = ${?DACHSHUND_SPOTIFY_TOKEN_ENCRYPTION_KEY}
    encryption-key-version = "v1"
  }
}
